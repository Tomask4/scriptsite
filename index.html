<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scripts Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f12;
      --surface:  #13161b;
      --card:     #1a1e26;
      --border:   #262c38;
      --border2:  #2f3747;
      --accent:   #4fffb0;
      --accent2:  #00cfff;
      --text:     #e8ecf4;
      --muted:    #7a879f;
      --code-bg:  #0a0c0f;
      --tag-bg:   #1e2d24;
      --tag-text: #4fffb0;
      --radius:   10px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      padding: 56px 48px 40px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #101318 0%, transparent 100%);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .logo-block { display: flex; align-items: center; gap: 14px; }

    .logo-icon {
      width: 44px; height: 44px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      box-shadow: 0 0 18px rgba(79,255,176,0.15);
      flex-shrink: 0;
    }

    h1 {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    h1 span { color: var(--accent); }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 3px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

    /* ── SEARCH BAR ── */
    .search-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 48px 0;
      z-index: 1;
    }

    .search-inner {
      position: relative;
    }

    .search-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box::placeholder { color: var(--muted); }
    .search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,255,176,0.08);
    }

    .search-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 14px;
      line-height: 1;
    }

    /* ── MAIN GRID ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 48px 80px;
      position: relative;
      z-index: 1;
    }

    .count-label {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .count-label strong { color: var(--accent); }

    .scripts-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── CARD ── */
    .script-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .script-card:hover {
      border-color: var(--border2);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    .card-header {
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }

    .card-header:hover .card-title { color: var(--accent); }

    .card-left { flex: 1; min-width: 0; }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      transition: color 0.15s;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(79,255,176,0.15);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-download {
      background: rgba(79,255,176,0.1);
      color: var(--accent);
      border: 1px solid rgba(79,255,176,0.25);
    }

    .btn-download:hover {
      background: rgba(79,255,176,0.18);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(79,255,176,0.15);
    }

    .toggle-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    .toggle-btn:hover { color: var(--text); border-color: var(--border2); }

    /* ── CODE BLOCK ── */
    .code-panel {
      display: none;
      border-top: 1px solid var(--border);
    }

    .code-panel.open { display: block; }

    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: var(--code-bg);
      border-bottom: 1px solid var(--border);
    }

    .code-filename {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .code-filename span { color: var(--accent2); }

    .btn-copy {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 12px;
      padding: 6px 12px;
    }

    .btn-copy:hover { color: var(--text); }
    .btn-copy.copied { color: var(--accent); border-color: rgba(79,255,176,0.3); }

    .code-scroll {
      overflow-x: auto;
      background: var(--code-bg);
    }

    pre {
      padding: 24px;
      margin: 0;
      font-family: 'DM Mono', monospace;
      font-size: 12.5px;
      line-height: 1.75;
      color: #c9d4e8;
      tab-size: 2;
      min-width: max-content;
    }

    /* ── SYNTAX HIGHLIGHT ── */
    .kw  { color: #7eb8ff; }   /* keywords */
    .fn  { color: #4fffb0; }   /* function names */
    .str { color: #f5bd6a; }   /* strings */
    .cm  { color: #4d5b6e; font-style: italic; } /* comments */
    .num { color: #ff9f7e; }   /* numbers */
    .cn  { color: #e879f9; }   /* constants / this */

    /* ── EMPTY / LOADING STATES ── */
    .state-msg {
      text-align: center;
      padding: 80px 24px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      font-size: 14px;
    }

    .state-msg .big { font-size: 32px; margin-bottom: 12px; }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 24px 48px;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
      color: var(--muted);
    }

    footer a { color: var(--muted); text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      header, .search-wrap, main, footer { padding-left: 20px; padding-right: 20px; }
      header { padding-top: 32px; }
      .card-actions { flex-direction: column; align-items: flex-end; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon">gs</div>
      <div>
        <h1><span>//</span> Scripts Library</h1>
        <div class="tagline">Google Apps Script collection</div>
      </div>
    </div>
    <div class="header-meta">
      <span class="dot"></span>
      <span id="script-count">laden...</span>
    </div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-inner">
    <span class="search-icon">⌕</span>
    <input class="search-box" type="text" id="search" placeholder="zoek op naam, tag of beschrijving..." autocomplete="off" />
  </div>
</div>

<main>
  <div class="count-label" id="result-label"></div>
  <div class="scripts-grid" id="grid">
    <div class="state-msg">
      <div class="big">⟳</div>
      scripts laden...
    </div>
  </div>
</main>


<script>
// ─────────────────────────────────────────
//  CONFIG — pas deze waarden aan
// ─────────────────────────────────────────
const CONFIG = {
  // Pad naar je index.json (relatief aan index.html of een absolute URL)
  indexUrl: 'scripts/index.json',
  // Basispad voor scriptbestanden
  scriptsBase: 'scripts/',
};

// ─────────────────────────────────────────
//  SYNTAX HIGHLIGHTER (token-gebaseerd)
// ─────────────────────────────────────────
function highlight(code) {
  const KEYWORDS  = /\b(function|return|var|let|const|if|else|for|while|do|switch|case|break|continue|new|this|typeof|instanceof|class|extends|import|export|default|try|catch|finally|throw|async|await|of|in)\b/;
  const CONSTANTS = /\b(true|false|null|undefined|NaN|Infinity)\b/;

  // Token types, in volgorde van prioriteit
  const TOKEN_RE = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|(["'`])((?:\\[\s\S]|(?!\3)[\s\S])*?)\3|(\b\d+\.?\d*\b)|([a-zA-Z_$][a-zA-Z0-9_$]*\s*(?=\())|([a-zA-Z_$][a-zA-Z0-9_$]*)/g;

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  let result = '';
  let lastIndex = 0;
  let m;
  TOKEN_RE.lastIndex = 0;

  while ((m = TOKEN_RE.exec(code)) !== null) {
    // Alles vóór deze match: gewone tekst, escapen
    if (m.index > lastIndex) {
      result += esc(code.slice(lastIndex, m.index));
    }
    lastIndex = TOKEN_RE.lastIndex;

    const [full, lineComment, blockComment, , , num, fnCall, word] = m;

    if (lineComment || blockComment) {
      result += `<span class="cm">${esc(full)}</span>`;
    } else if (m[3] !== undefined) {
      // string (m[3] = quote char)
      result += `<span class="str">${esc(full)}</span>`;
    } else if (num !== undefined) {
      result += `<span class="num">${esc(num)}</span>`;
    } else if (fnCall !== undefined) {
      // functienaam + whitespace vóór '('
      const name = fnCall.replace(/\s+$/, '');
      const trail = fnCall.slice(name.length);
      result += `<span class="fn">${esc(name)}</span>${esc(trail)}`;
    } else if (word !== undefined) {
      if (KEYWORDS.test(word)) {
        result += `<span class="kw">${esc(word)}</span>`;
      } else if (CONSTANTS.test(word)) {
        result += `<span class="cn">${esc(word)}</span>`;
      } else {
        result += esc(word);
      }
    } else {
      result += esc(full);
    }
  }

  // Rest van de code
  if (lastIndex < code.length) {
    result += esc(code.slice(lastIndex));
  }

  return result;
}

// ─────────────────────────────────────────
//  RENDER CARD
// ─────────────────────────────────────────
function createCard(script) {
  const card = document.createElement('div');
  card.className = 'script-card';
  card.dataset.search = [script.name, script.description, ...(script.tags || [])].join(' ').toLowerCase();

  const tagsHtml = (script.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

  card.innerHTML = `
    <div class="card-header" data-card-toggle>
      <div class="card-left">
        <div class="card-title">${script.name}</div>
        <div class="card-desc">${script.description || 'Geen beschrijving.'}</div>
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      </div>
      <div class="card-actions">
        <a class="btn btn-download" href="${CONFIG.scriptsBase}${script.file}" download="${script.file}">
          ↓ download
        </a>
        <button class="btn toggle-btn" data-toggle-icon>{ }</button>
      </div>
    </div>
    <div class="code-panel" data-panel>
      <div class="code-toolbar">
        <span class="code-filename">scripts/<span>${script.file}</span></span>
        <button class="btn btn-copy" data-copy>kopiëren</button>
      </div>
      <div class="code-scroll">
        <pre data-pre>laden...</pre>
      </div>
    </div>
  `;

  const panel = card.querySelector('[data-panel]');
  const pre   = card.querySelector('[data-pre]');
  const copyBtn = card.querySelector('[data-copy]');
  const toggleIcon = card.querySelector('[data-toggle-icon]');
  let loaded = false;

  card.querySelector('[data-card-toggle]').addEventListener('click', async (e) => {
    if (e.target.closest('.btn-download')) return; // don't toggle on download click
    const isOpen = panel.classList.toggle('open');
    toggleIcon.textContent = isOpen ? '×' : '{ }';

    if (isOpen && !loaded) {
      try {
        const res = await fetch(CONFIG.scriptsBase + script.file + '?nocache=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const code = await res.text();
        pre.dataset.raw = code;
        pre.innerHTML = highlight(code);
        loaded = true;
      } catch (err) {
        pre.textContent = '// Fout bij laden: ' + err.message;
      }
    }
  });

  copyBtn.addEventListener('click', () => {
    const text = pre.dataset.raw || pre.textContent;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = '✓ gekopieerd';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'kopiëren';
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  });

  return card;
}

// ─────────────────────────────────────────
//  LOAD & FILTER
// ─────────────────────────────────────────
let allCards = [];

async function loadScripts() {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch(CONFIG.indexUrl + '?nocache=' + Date.now());
    if (!res.ok) throw new Error('index.json niet gevonden (HTTP ' + res.status + ')');
    const scripts = await res.json();

    grid.innerHTML = '';
    allCards = [];

    if (!scripts.length) {
      grid.innerHTML = '<div class="state-msg"><div class="big">∅</div>Nog geen scripts toegevoegd.</div>';
      return;
    }

    scripts.forEach(s => {
      const card = createCard(s);
      allCards.push(card);
      grid.appendChild(card);
    });

    document.getElementById('script-count').textContent = scripts.length + ' script' + (scripts.length !== 1 ? 's' : '');
    updateLabel(scripts.length, scripts.length);

  } catch (err) {
    grid.innerHTML = `
      <div class="state-msg">
        <div class="big">⚠</div>
        Kon scripts niet laden.<br>
        <small style="margin-top:8px;display:block">${err.message}</small>
        <small style="margin-top:4px;display:block;color:#4a5568">Controleer of <code>scripts/index.json</code> bestaat in je repository.</small>
      </div>`;
  }
}

function updateLabel(shown, total) {
  const el = document.getElementById('result-label');
  if (shown === total) {
    el.innerHTML = `<strong>${total}</strong> script${total !== 1 ? 's' : ''} beschikbaar`;
  } else {
    el.innerHTML = `<strong>${shown}</strong> van ${total} scripts gevonden`;
  }
}

// ─────────────────────────────────────────
//  SEARCH
// ─────────────────────────────────────────
document.getElementById('search').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  let shown = 0;
  allCards.forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  updateLabel(shown, allCards.length);
});

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
loadScripts();
</script>
</body>
</html>
